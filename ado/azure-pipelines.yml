trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: '18.x'
  artifactName: 'drop'
  npmPackageName: 'devsecops-assessment-node'
  chartArtifactName: 'helm-manifests'
  imageTag: $(Build.BuildId)
  helmChartPath: 'charts/devsecops-app'
  namespace: 'default'
  releaseName: 'devsecops-app'
  enableGitleaks: 'true'

pool:
  vmImage: ubuntu-latest

stages:
- stage: BuildAndTest
  displayName: Build and Test
  jobs:
  - job: CI
    displayName: Node CI
    steps:
    - checkout: self

    - template: templates/node-ci-steps.yml
      parameters:
        nodeVersion: $(nodeVersion)
        runLint: true
        runTests: true

    - script: |
        curl -sSfL \
          https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
          | tar xz -C /tmp gitleaks
        /tmp/gitleaks detect \
          --source $(Build.SourcesDirectory) \
          --report-path $(Build.ArtifactStagingDirectory)/gitleaks-report.json \
          --report-format json \
          --exit-code 1
      displayName: 'Secret scanning (gitleaks)'
      condition: and(succeeded(), eq(variables['enableGitleaks'], 'true'))

    - task: PublishPipelineArtifact@0
      displayName: 'Publish gitleaks report'
      condition: and(always(), eq(variables['enableGitleaks'], 'true'))
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/gitleaks-report.json'
        artifactName: 'gitleaks-report'

- stage: Package
  displayName: Package (npm .tgz)
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
  - job: PackageJob
    displayName: Create npm package + publish artifact
    steps:
    - checkout: self

    - template: templates/node-ci-steps.yml
      parameters:
        nodeVersion: $(nodeVersion)
        runLint: false
        runTests: false

    - script: |
        npm run pack:npm
        mkdir -p out
        mv *.tgz out/
        echo "Package generated:"
        ls -lh out/
      displayName: 'Create npm package (.tgz) into out/'

    - task: PublishPipelineArtifact@0
      displayName: 'Publish npm package as Pipeline Artifact ($(artifactName))'
      inputs:
        targetPath: '$(Build.SourcesDirectory)/out'
        artifactName: '$(artifactName)'

    # Para publicar a un Azure Artifacts npm feed ver docs/azure-artifacts-concept.md.

- stage: Kubernetes
  displayName: Kubernetes / Helm Validation
  dependsOn: Package
  condition: succeeded()
  jobs:
  - job: HelmValidate
    displayName: Lint and render Helm chart
    steps:
    - checkout: self

    - task: HelmInstaller@1
      displayName: 'Install Helm'
      inputs:
        helmVersionToInstall: 'latest'

    - script: helm lint $(helmChartPath)
      displayName: 'helm lint'

    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/helm-manifests
        helm template $(releaseName) $(helmChartPath) \
          --namespace $(namespace) \
          > $(Build.ArtifactStagingDirectory)/helm-manifests/manifests.yaml
        echo "--- Rendered manifests ---"
        cat $(Build.ArtifactStagingDirectory)/helm-manifests/manifests.yaml
      displayName: 'helm template (render manifests)'

    - task: PublishPipelineArtifact@0
      displayName: 'Publish rendered Helm manifests ($(chartArtifactName))'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/helm-manifests'
        artifactName: '$(chartArtifactName)'

- stage: Container
  displayName: Container Build (no push)
  dependsOn: Kubernetes
  condition: succeeded()
  jobs:
  - job: DockerBuild
    displayName: Build Docker Image
    steps:
    - checkout: self

    - script: |
        docker build \
          -t $(npmPackageName):$(imageTag) \
          -t $(npmPackageName):latest \
          .
      displayName: 'Docker build (tagged with Build.BuildId)'

    - script: |
        docker image inspect $(npmPackageName):$(imageTag)
      displayName: 'Docker image inspect (evidence, no push)'