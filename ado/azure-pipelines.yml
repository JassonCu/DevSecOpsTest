trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: '18.x'
  artifactName: 'drop'
  npmPackageName: 'devsecops-assessment-node'
  chartArtifactName: 'helm-chart'
  # TODO: agregar variables/parametros útiles (ej. imageTag, enableGitleaks, helmChartPath, namespace, releaseName)

pool:
  vmImage: ubuntu-latest

stages:
- stage: BuildAndTest
  displayName: Build and Test
  jobs:
  - job: CI
    displayName: Node CI
    steps:
    - checkout: self

    # TODO: usar template en vez de tener todos los pasos inline
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Use Node $(nodeVersion)'

    - script: |
        npm install
        npm test
      displayName: 'Install and test'
      # TODO: cambiar a npm ci y agregar cache de npm

    # TODO (opcional - desempate): integrar gitleaks (solo escaneo). Publicar reporte como artifact.

- stage: Package
  displayName: Package (conceptual npm package)
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
  - job: PackageJob
    displayName: Create package + publish artifact
    steps:
    - checkout: self

    # TODO: reusar un template de pasos para evitar duplicación
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Use Node $(nodeVersion)'

    - script: |
        npm ci
        npm run pack:npm
        mkdir -p out
        mv *.tgz out/ || true
      displayName: 'Create npm package (.tgz) into out/'
      # TODO: asegurar que el nombre del .tgz sea determinístico y agregar metadata

    # TODO: publicar out/ como pipeline artifact $(artifactName)
    # Nota: La publicación a un Azure Artifacts npm feed es SOLO conceptual y debe documentarse, no configurarse.

- stage: Kubernetes
  displayName: Kubernetes / Helm Validation
  dependsOn: Package
  condition: succeeded()
  jobs:
  - job: HelmValidate
    displayName: Lint and render Helm chart
    steps:
    - checkout: self
    # TODO: corregir chart Helm en charts/devsecops-app/
    # TODO: instalar Helm o usar herramienta disponible en agente
    # TODO: ejecutar 'helm lint' y 'helm template' sobre el chart
    # TODO: corregir deployment.yaml y values.yaml para readiness/liveness, resources, image repo/tag, service port, namespace/release placeholders
    # TODO: publicar manifests renderizados (helm template) como artifact $(chartArtifactName)

- stage: Container
  displayName: Container Build (no push)
  dependsOn: Kubernetes
  condition: succeeded()
  jobs:
  - job: DockerBuild
    displayName: Build Docker Image
    steps:
    - checkout: self
    - script: |
        docker build -t $(npmPackageName):latest .
      displayName: 'Docker build'
    # TODO: agregar tag con $(Build.BuildId) y evidencia docker image inspect
